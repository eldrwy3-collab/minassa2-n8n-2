<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aribeth Engine Suite · AI Automation Architecture</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* الأنماط الأساسية (حافظت على تصاميمك لكن أضفت تعديلات للقوائم الجديدة) */
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#05080f;font-family:'Inter',sans-serif;display:flex;justify-content:center;padding:24px 20px;color:#f8fafc;min-height:100vh}
        .wrapper{max-width:1600px;width:100%;background:linear-gradient(165deg,#0a0f1e,#070b16);border-radius:32px;padding:44px 48px;border:1px solid rgba(30,41,59,0.6)}
        .header{text-align:center;margin-bottom:30px}
        .header-badge{display:inline-block;background:rgba(16,185,129,0.10);color:#10b981;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;padding:6px 22px;border-radius:40px;border:1px solid rgba(16,185,129,0.20);margin-bottom:18px}
        .header h1{font-size:56px;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#fff 40%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header h1 span{background:linear-gradient(135deg,#f97316,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header p{font-size:18px;color:#94a3b8;max-width:780px;margin:0 auto;line-height:1.8}
        .nav-bar{display:flex;justify-content:center;gap:8px;margin-bottom:24px}
        .nav-btn{background:rgba(17,24,39,0.4);border:1px solid rgba(31,41,55,0.3);border-radius:10px;padding:8px 20px;color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer}
        .nav-btn.active{background:rgba(16,185,129,0.10);border-color:#10b981;color:#10b981}
        .user-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(17,24,39,0.4);border-radius:14px;border:1px solid rgba(31,41,55,0.3);margin-bottom:24px}
        .user-details{display:flex;flex-direction:column}
        .user-details .name{font-weight:700;color:#fff;font-size:15px}
        .user-details .email{font-size:12px;color:#94a3b8}
        .grid{display:grid;grid-template-columns:380px 1fr;gap:30px;margin-bottom:36px}
        .panel{background:rgba(17,24,39,0.5);padding:24px 26px;border-radius:18px;border:1px solid rgba(31,41,55,0.5)}
        .panel-label{display:block;font-weight:700;color:#fff;font-size:15px;margin-bottom:14px}
        
        /* قائمة المجالات الجديدة (بدلاً من 10 أزرار) */
        .domain-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;padding-right:4px}
        .domain-list::-webkit-scrollbar{width:4px}
        .domain-list::-webkit-scrollbar-thumb{background:#10b981;border-radius:10px}
        .domain-btn{padding:11px 16px;border-radius:10px;border:1px solid rgba(55,65,81,0.5);background:rgba(255,255,255,0.02);color:#e2e8f0;font-weight:600;font-size:13px;cursor:pointer;text-align:left;width:100%}
        .domain-btn:hover{background:rgba(16,185,129,0.07);border-color:#10b981;color:#10b981}
        .domain-btn.selected{background:rgba(16,185,129,0.12);border-color:#10b981;color:#10b981}
        .domain-btn .count{float:right;font-size:11px;color:#64748b}

        /* قائمة الوسائط (الجديدة) */
        .media-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;padding-right:4px;margin-bottom:20px;border-top:1px solid rgba(55,65,81,0.3);padding-top:16px}
        .media-btn{padding:8px 14px;border-radius:8px;border:1px solid rgba(55,65,81,0.4);background:rgba(255,255,255,0.02);color:#94a3b8;font-weight:600;font-size:12px;cursor:pointer;text-align:left;width:100%}
        .media-btn:hover{background:rgba(59,130,246,0.07);border-color:#3b82f6;color:#3b82f6}

        .generate-btn{width:100%;margin-top:14px;padding:16px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
        
        /* عرض الخريطة والنتائج */
        .canvas-section{background:rgba(3,7,18,0.6);border-radius:18px;padding:30px 28px;border:2px solid rgba(16,185,129,0.15);margin-bottom:28px;min-height:400px}
        #nodesCanvas{display:flex;align-items:center;justify-content:flex-start;gap:14px;padding:30px 20px;background:rgba(8,12,23,0.6);border-radius:14px;min-height:300px;overflow-x:auto}
        .node-card{background:linear-gradient(145deg,#111827,#0d1422);border:2px solid rgba(55,65,81,0.5);border-radius:14px;padding:16px 18px;width:190px;min-width:180px;text-align:center;position:relative;flex-shrink:0}
        .node-card.trigger{border-color:#f97316;background:linear-gradient(145deg,#1f1711,#16100b)}
        .node-card.logic{border-color:#3b82f6;background:linear-gradient(145deg,#111d2e,#0d1728)}
        .node-card.action{border-color:#10b981;background:linear-gradient(145deg,#11231c,#0d1d17)}
        .node-icon{font-size:28px;margin-bottom:6px;display:block}
        .node-title{font-weight:700;color:#fff;font-size:13px}
        .node-sub{font-size:10px;color:#94a3b8;margin-top:4px}
        .node-arrow{color:#64748b;font-weight:700;font-size:22px;flex-shrink:0}
        .result-links{margin-bottom:16px;background:rgba(17,24,39,0.4);padding:16px;border-radius:12px;border:1px solid rgba(31,41,55,0.4)}
        .result-links a{display:block;color:#10b981;text-decoration:none;margin-bottom:8px;font-size:14px;font-weight:600}
        .result-links a:hover{text-decoration:underline}
    </style>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header-badge">⚡ AI-Powered Automation Architecture</div>
            <h1>Aribeth <span>Engine</span> Suite</h1>
            <p>Select a domain, choose your media type, and get a real production workflow.</p>
        </header>

        <div class="user-bar">
            <div class="user-details">
                <span class="name" id="userName">Guest</span>
                <span class="email" id="userEmail">Not signed in</span>
            </div>
            <button class="nav-btn" id="logoutBtn" style="display:none;color:#f87171;">Logout</button>
        </div>

        <!-- ===== الصفحة الرئيسية ===== -->
        <div class="page active" id="page-home">
            <div class="grid">
                
                <!-- اللوحة اليسرى: المجالات والوسائط -->
                <div class="panel">
                    <label class="panel-label">📂 Select Automation Domain</label>
                    <div class="domain-list" id="domainList">
                        <div style="color:#64748b; font-size:13px;">Loading domains from database...</div>
                    </div>

                    <label class="panel-label" style="margin-top:20px; color:#3b82f6;">🎬 Select Media Type</label>
                    <div class="media-list" id="mediaList">
                        <div style="color:#64748b; font-size:13px;">Select a domain first</div>
                    </div>

                    <button class="generate-btn" id="generateBtn">🚀 Generate Automation Workflow</button>
                </div>

                <!-- اللوحة اليمنى: العرض -->
                <div class="panel">
                    <label class="panel-label">🗺️ Generated Workflow Node Map</label>
                    <div class="canvas-section" style="padding:0; border:none; min-height:auto;">
                        <div id="nodesCanvas"><div class="loading-placeholder">Waiting for your selection...</div></div>
                    </div>

                    <div id="analysisBox" class="result-links" style="border:none; padding:0; margin-top:20px;">
                        <label class="panel-label" style="margin-bottom:8px;">🔗 Top Templates Found:</label>
                        <div id="templateLinks">Nothing to show yet.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ ضع رابط n8n Webhook هنا (الرابط الذي يبدأ بـ https://...app.n8n.cloud/webhook/...)
        const webhookURL = "https://your-n8n-instance.app.n8n.cloud/webhook/YOUR_WEBHOOK_ID"; 

        let globalData = {
            domains: [],
            media: [],
            results: []
        };

        let selectedDomain = null;
        let selectedMedia = null;

        // 1. جلب البيانات من n8n عند فتح الصفحة
        async function fetchData() {
            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                const data = await response.json();
                
                globalData.domains = data.all_domains_menu || [];
                globalData.media = data.all_media_types_menu || [];
                globalData.results = data.top_results || [];

                renderDomains();
            } catch (error) {
                document.getElementById('domainList').innerHTML = 
                    `<div style="color:#f87171;">Error connecting to n8n. Check your Webhook URL.</div>`;
                console.error(error);
            }
        }

        // 2. عرض قائمة المجالات
        function renderDomains() {
            const domainList = document.getElementById('domainList');
            domainList.innerHTML = '';
            
            globalData.domains.forEach(domain => {
                const btn = document.createElement('button');
                btn.className = 'domain-btn';
                btn.innerHTML = `${domain.domain_name} <span class="count">(${domain.total_templates})</span>`;
                btn.onclick = () => selectDomain(domain.domain_name);
                domainList.appendChild(btn);
            });
        }

        // 3. عند اختيار مجال، عرض الوسائط المتاحة له
        function selectDomain(domainName) {
            selectedDomain = domainName;
            selectedMedia = null;
            
            // تمييز الزر المختار
            document.querySelectorAll('.domain-btn').forEach(btn => {
                btn.classList.remove('selected');
                if(btn.textContent.includes(domainName)) btn.classList.add('selected');
            });

            // إيجاد الوسائط الخاصة بهذا المجال
            const mediaData = globalData.media.find(m => m.domain === domainName);
            const mediaList = document.getElementById('mediaList');
            mediaList.innerHTML = '';

            if (mediaData && mediaData.media.length > 0) {
                mediaData.media.forEach(m => {
                    const btn = document.createElement('button');
                    btn.className = 'media-btn';
                    btn.textContent = `${m.type} (${m.count})`;
                    btn.onclick = () => selectMedia(m.type);
                    mediaList.appendChild(btn);
                });
            } else {
                mediaList.innerHTML = '<div style="color:#64748b; font-size:13px;">No specific media tools found for this domain.</div>';
            }
        }

        // 4. عند اختيار وسيط
        function selectMedia(mediaName) {
            selectedMedia = mediaName;
            
            document.querySelectorAll('.media-btn').forEach(btn => {
                btn.classList.remove('selected');
                btn.style.borderColor = '#3b82f6';
                btn.style.color = '#3b82f6';
                if(btn.textContent.includes(mediaName)) {
                    btn.style.borderColor = '#10b981';
                    btn.style.color = '#10b981';
                }
            });

            // 5. عرض القوالب المطابقة
            renderResults();
        }

        // 6. عرض القوالب المطابقة (روابط)
        function renderResults() {
            const templateLinks = document.getElementById('templateLinks');
            templateLinks.innerHTML = '';

            // نستخدم النتائج التي تم جلبها مسبقاً من n8n
            if (globalData.results.length > 0) {
                globalData.results.forEach(template => {
                    const a = document.createElement('a');
                    a.href = template.url;
                    a.target = "_blank";
                    a.textContent = `🔗 ${template.title}`;
                    templateLinks.appendChild(a);
                });
            } else {
                templateLinks.innerHTML = '<span style="color:#64748b;">No templates found for your selection. Check n8n data.</span>';
            }

            // 7. عرض الخريطة المتفرعة (المستقبلة من n8n)
            renderMap(globalData.generated_workflow);
        }

        // 8. عرض الخريطة (الأسهم والعقد)
        function renderMap(workflow) {
            const canvas = document.getElementById('nodesCanvas');
            if (!workflow || !workflow.nodes) {
                canvas.innerHTML = '<div class="loading-placeholder">Workflow structure not received.</div>';
                return;
            }

            let html = '';
            workflow.nodes.forEach((node, index) => {
                // تحديد أيقونة ونوع افتراضي
                let icon = '⚙️';
                let type = 'action';
                if (node.type.includes('webhook')) { icon = '⚡'; type = 'trigger'; }
                if (node.type.includes('if') || node.type.includes('switch')) { icon = '🔀'; type = 'logic'; }

                html += `<div class="node-card ${type}">
                            <span class="node-icon">${icon}</span>
                            <div class="node-title">${node.name}</div>
                            <div class="node-sub">${node.type}</div>
                        </div>`;
                
                // إضافة سهم بين العقد
                if (index < workflow.nodes.length - 1) {
                    html += `<span class="node-arrow">➔</span>`;
                }
            });

            canvas.innerHTML = html;
        }

        // 9. زر التوليد (سيقوم بتمرير الاختيار للـ Webhook)
        document.getElementById('generateBtn').onclick = async () => {
            if (!selectedDomain || !selectedMedia) {
                alert("Please select a Domain and a Media Type.");
                return;
            }

            document.getElementById('generateBtn').textContent = '⏳ Generating...';

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        domain: selectedDomain,
                        media: selectedMedia
                    })
                });
                const data = await response.json();
                
                // تحديث النتائج والخريطة
                globalData.results = data.top_results || [];
                globalData.generated_workflow = data.generated_workflow;
                
                renderResults();
                document.getElementById('generateBtn').textContent = '🚀 Generate Automation Workflow';
            } catch (error) {
                console.error(error);
                alert("Error generating workflow.");
                document.getElementById('generateBtn').textContent = '🚀 Generate Automation Workflow';
            }
        };

        // تشغيل عند فتح الصفحة
        fetchData();
    </script>
</body>
</html>
